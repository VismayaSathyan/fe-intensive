<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card One</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="email-card">
        <img src="logo1.png" height="200px" alt="logo">
        <h2 class="card-one-heading">Check Your Email</h2>
        <p class="card-one-subHeading">Enter the 6 digit code we sent to <span style="color:#000;">xyz@gmail.com</span>
            to
            continue</p>
        <div class="email-card-input-div">
            <input type="text" name="otp" id="otp" class="email-card-input">
        </div>
        <button class="btn">Continue</button>
    </div>
</body>

</html>
